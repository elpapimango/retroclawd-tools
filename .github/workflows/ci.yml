name: ci
on: [push, pull_request]
env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - uses: actions/upload-artifact@v6
        with:
          name: tools-${{ matrix.os }}
          path: |
            target/release/rcasm
            target/release/rcasm.exe
            target/release/rcdis
            target/release/rcdis.exe
            target/release/rcdisk
            target/release/rcdisk.exe
            target/release/rctape
            target/release/rctape.exe
            target/release/rcsnap
            target/release/rcsnap.exe
            target/release/rcld
            target/release/rcld.exe
          if-no-files-found: ignore

