[package]
name = "rcdis"
description = "Disassembler for the 6502, Z80, HuC6280, 65816, SPC700 and 68000 that writes source rcasm can assemble (retroclawd tools)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "rcdis"

[[bin]]
name = "rcdis"
path = "src/main.rs"

[dependencies]
rc-common = { path = "../rc-common", version = "0.6.3" }
rcasm = { path = "../rcasm", version = "0.6.3" }
machine.workspace = true
z80.workspace = true
mos6502.workspace = true
mc68000.workspace = true
huc6280.workspace = true
w65c816.workspace = true
spc700.workspace = true
clap.workspace = true
