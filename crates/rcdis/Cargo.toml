[package]
name = "rcdis"
description = "Disassembler for the 6502 and Z80 that writes source rcasm can assemble (retroclawd tools)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "rcdis"

[[bin]]
name = "rcdis"
path = "src/main.rs"

[dependencies]
rc-common = { path = "../rc-common" }
rcasm = { path = "../rcasm" }
machine.workspace = true
z80.workspace = true
mos6502.workspace = true
mc68000.workspace = true
clap.workspace = true
