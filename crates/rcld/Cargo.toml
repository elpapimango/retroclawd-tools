[package]
name = "rcld"
description = "Place assembled programs and emit a runnable image (retroclawd tools)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "rcld"

[[bin]]
name = "rcld"
path = "src/main.rs"

[dependencies]
atari-media.workspace = true
rc-common = { path = "../rc-common", version = "0.3.0" }
rcasm = { path = "../rcasm", version = "0.3.0" }
rcdisk = { path = "../rcdisk", version = "0.3.0" }
rctape = { path = "../rctape", version = "0.3.0" }
rcsnap = { path = "../rcsnap", version = "0.3.0" }
c64-cartridge.workspace = true
ines.workspace = true
sfc.workspace = true
amiga.workspace = true
x68k.workspace = true
serde.workspace = true
toml.workspace = true
clap.workspace = true
