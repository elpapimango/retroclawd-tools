[workspace]
resolver = "2"
members = ["crates/rc-common", "crates/rcasm", "crates/rcdis", "crates/rcdisk", "crates/rctape", "crates/rcsnap", "crates/rcld", "crates/rc-suite"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# The retroclawd crates, by git revision (public repositories).
machine = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "577447c0755a69f757fb97c885345cd71922ffc8" }
z80 = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "577447c0755a69f757fb97c885345cd71922ffc8" }
mos6502 = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "577447c0755a69f757fb97c885345cd71922ffc8" }
# The Commodore format crates (retroclawd-commodore), by revision.
cbm-dos = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "45aec0b4ea14a92b6683c3feb949c1155cc329de" }
d64 = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "45aec0b4ea14a92b6683c3feb949c1155cc329de" }
d71 = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "45aec0b4ea14a92b6683c3feb949c1155cc329de" }
d81 = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "45aec0b4ea14a92b6683c3feb949c1155cc329de" }
g64 = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "45aec0b4ea14a92b6683c3feb949c1155cc329de" }
c64-tape = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "45aec0b4ea14a92b6683c3feb949c1155cc329de" }
dsk = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "577447c0755a69f757fb97c885345cd71922ffc8" }
zx-tape = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "577447c0755a69f757fb97c885345cd71922ffc8" }
# Snapshot and cartridge formats of the machine families (by revision). Their Z80 snapshot types use the
# `retroclawd-crates` revision the families pin; keep it equal to the one above so there is one `z80` in the graph.
z80-snapshot = { git = "https://github.com/elpapimango/retroclawd-sinclair", rev = "1678958fcf0cb2f178edccc81119c06ea41109f5" }
sna-snapshot = { git = "https://github.com/elpapimango/retroclawd-sinclair", rev = "1678958fcf0cb2f178edccc81119c06ea41109f5" }
szx-snapshot = { git = "https://github.com/elpapimango/retroclawd-sinclair", rev = "1678958fcf0cb2f178edccc81119c06ea41109f5" }
zx81-snapshot = { git = "https://github.com/elpapimango/retroclawd-sinclair", rev = "1678958fcf0cb2f178edccc81119c06ea41109f5" }
cpc-snapshot = { git = "https://github.com/elpapimango/retroclawd-amstrad", rev = "4719250e5e17ead79b754ac7ff1207e6bb425018" }
cpc-cartridge = { git = "https://github.com/elpapimango/retroclawd-amstrad", rev = "4719250e5e17ead79b754ac7ff1207e6bb425018" }
c64-cartridge = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "45aec0b4ea14a92b6683c3feb949c1155cc329de" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }

[profile.release]
strip = true
opt-level = 3
