[workspace]
resolver = "2"
members = ["crates/rc-common", "crates/rcasm", "crates/rcdis", "crates/rcdisk", "crates/rctape", "crates/rcsnap", "crates/rcld", "crates/rc-suite"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# The retroclawd crates, by git revision (public repositories).
machine = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "318a2cc4cc1d758aeebfe2a46f962c3506a8a0cf" }
z80 = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "318a2cc4cc1d758aeebfe2a46f962c3506a8a0cf" }
mos6502 = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "318a2cc4cc1d758aeebfe2a46f962c3506a8a0cf" }
# The Commodore format crates (retroclawd-commodore), by revision.
cbm-dos = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "8f987d59cf2a23e1a4303c25b9ea448d26f2ce7a" }
d64 = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "8f987d59cf2a23e1a4303c25b9ea448d26f2ce7a" }
d71 = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "8f987d59cf2a23e1a4303c25b9ea448d26f2ce7a" }
d81 = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "8f987d59cf2a23e1a4303c25b9ea448d26f2ce7a" }
g64 = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "8f987d59cf2a23e1a4303c25b9ea448d26f2ce7a" }
c64-tape = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "8f987d59cf2a23e1a4303c25b9ea448d26f2ce7a" }
dsk = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "318a2cc4cc1d758aeebfe2a46f962c3506a8a0cf" }
zx-tape = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "318a2cc4cc1d758aeebfe2a46f962c3506a8a0cf" }
# Snapshot and cartridge formats of the machine families (by revision). Their Z80 snapshot types use the
# `retroclawd-crates` revision the families pin; keep it equal to the one above so there is one `z80` in the graph.
z80-snapshot = { git = "https://github.com/elpapimango/retroclawd-sinclair", rev = "638ba2ca3a58cb3d8b70cedb881e9fe882501d52" }
sna-snapshot = { git = "https://github.com/elpapimango/retroclawd-sinclair", rev = "638ba2ca3a58cb3d8b70cedb881e9fe882501d52" }
szx-snapshot = { git = "https://github.com/elpapimango/retroclawd-sinclair", rev = "638ba2ca3a58cb3d8b70cedb881e9fe882501d52" }
zx81-snapshot = { git = "https://github.com/elpapimango/retroclawd-sinclair", rev = "638ba2ca3a58cb3d8b70cedb881e9fe882501d52" }
cpc-snapshot = { git = "https://github.com/elpapimango/retroclawd-amstrad", rev = "f0d3aeb2ea79d485ea95284977c764aa32a68a28" }
cpc-cartridge = { git = "https://github.com/elpapimango/retroclawd-amstrad", rev = "f0d3aeb2ea79d485ea95284977c764aa32a68a28" }
c64-cartridge = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "8f987d59cf2a23e1a4303c25b9ea448d26f2ce7a" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }

[profile.release]
strip = true
opt-level = 3
