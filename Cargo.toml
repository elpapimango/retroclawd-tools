[workspace]
resolver = "2"
members = ["crates/rc-common", "crates/rcasm", "crates/rcdis", "crates/rcdisk", "crates/rctape", "crates/rcsnap", "crates/rcld", "crates/rc-suite"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# The retroclawd crates, by git revision (public repositories).
machine = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "4291f5dbe8733b0e743d45becadb1ece1d60746c" }
z80 = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "4291f5dbe8733b0e743d45becadb1ece1d60746c" }
mos6502 = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "4291f5dbe8733b0e743d45becadb1ece1d60746c" }
# The Commodore format crates (retroclawd-commodore), by revision.
cbm-dos = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "6b99fe540c62f5ac102fdf058351e18d5017b59b" }
d64 = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "6b99fe540c62f5ac102fdf058351e18d5017b59b" }
d71 = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "6b99fe540c62f5ac102fdf058351e18d5017b59b" }
d81 = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "6b99fe540c62f5ac102fdf058351e18d5017b59b" }
g64 = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "6b99fe540c62f5ac102fdf058351e18d5017b59b" }
c64-tape = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "6b99fe540c62f5ac102fdf058351e18d5017b59b" }
dsk = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "4291f5dbe8733b0e743d45becadb1ece1d60746c" }
zx-tape = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "4291f5dbe8733b0e743d45becadb1ece1d60746c" }
# Snapshot and cartridge formats of the machine families (by revision). Their Z80 snapshot types use the
# `retroclawd-crates` revision the families pin; keep it equal to the one above so there is one `z80` in the graph.
z80-snapshot = { git = "https://github.com/elpapimango/retroclawd-sinclair", rev = "e6894b5642005dc1b6a7a426402acf7b11d2bd32" }
sna-snapshot = { git = "https://github.com/elpapimango/retroclawd-sinclair", rev = "e6894b5642005dc1b6a7a426402acf7b11d2bd32" }
szx-snapshot = { git = "https://github.com/elpapimango/retroclawd-sinclair", rev = "e6894b5642005dc1b6a7a426402acf7b11d2bd32" }
zx81-snapshot = { git = "https://github.com/elpapimango/retroclawd-sinclair", rev = "e6894b5642005dc1b6a7a426402acf7b11d2bd32" }
cpc-snapshot = { git = "https://github.com/elpapimango/retroclawd-amstrad", rev = "d3376733ad0d33c34b92c1aa3e216af58f2d5a21" }
cpc-cartridge = { git = "https://github.com/elpapimango/retroclawd-amstrad", rev = "d3376733ad0d33c34b92c1aa3e216af58f2d5a21" }
c64-cartridge = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "6b99fe540c62f5ac102fdf058351e18d5017b59b" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }

[profile.release]
strip = true
opt-level = 3
