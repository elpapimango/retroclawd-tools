[workspace]
resolver = "2"
members = ["crates/rc-common", "crates/rcasm", "crates/rcdis", "crates/rcdisk", "crates/rctape", "crates/rcsnap", "crates/rcld", "crates/rc-suite"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# The retroclawd crates, by git revision (public repositories).
machine = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "a8cfb2ef44aef943d6900c98bce02758acf926eb" }
z80 = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "a8cfb2ef44aef943d6900c98bce02758acf926eb" }
mos6502 = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "a8cfb2ef44aef943d6900c98bce02758acf926eb" }
# The Commodore format crates (retroclawd-commodore), by revision.
cbm-dos = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "f4cb47adad8d34d1658a3f22411a26f6ec5a5e14" }
d64 = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "f4cb47adad8d34d1658a3f22411a26f6ec5a5e14" }
d71 = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "f4cb47adad8d34d1658a3f22411a26f6ec5a5e14" }
d81 = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "f4cb47adad8d34d1658a3f22411a26f6ec5a5e14" }
g64 = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "f4cb47adad8d34d1658a3f22411a26f6ec5a5e14" }
c64-tape = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "f4cb47adad8d34d1658a3f22411a26f6ec5a5e14" }
dsk = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "a8cfb2ef44aef943d6900c98bce02758acf926eb" }
zx-tape = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "a8cfb2ef44aef943d6900c98bce02758acf926eb" }
# Snapshot and cartridge formats of the machine families (by revision). Their Z80 snapshot types use the
# `retroclawd-crates` revision the families pin; keep it equal to the one above so there is one `z80` in the graph.
z80-snapshot = { git = "https://github.com/elpapimango/retroclawd-sinclair", rev = "93fa593f6150c101fc3d6ab83e46916cbbb50dcb" }
sna-snapshot = { git = "https://github.com/elpapimango/retroclawd-sinclair", rev = "93fa593f6150c101fc3d6ab83e46916cbbb50dcb" }
szx-snapshot = { git = "https://github.com/elpapimango/retroclawd-sinclair", rev = "93fa593f6150c101fc3d6ab83e46916cbbb50dcb" }
zx81-snapshot = { git = "https://github.com/elpapimango/retroclawd-sinclair", rev = "93fa593f6150c101fc3d6ab83e46916cbbb50dcb" }
cpc-snapshot = { git = "https://github.com/elpapimango/retroclawd-amstrad", rev = "34461e3e1faa6931b405b3b7896c3cbda71ce96a" }
cpc-cartridge = { git = "https://github.com/elpapimango/retroclawd-amstrad", rev = "34461e3e1faa6931b405b3b7896c3cbda71ce96a" }
c64-cartridge = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "f4cb47adad8d34d1658a3f22411a26f6ec5a5e14" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }

[profile.release]
strip = true
opt-level = 3
