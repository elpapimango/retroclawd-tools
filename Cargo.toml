[workspace]
resolver = "2"
members = ["crates/rc-common", "crates/rcasm", "crates/rcdis", "crates/rcdisk", "crates/rctape", "crates/rcsnap", "crates/rcld", "crates/rc-suite"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# The retroclawd crates, by git revision (public repositories).
machine = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "d64444aa6a1e38ab5068af216a58091f7ffb2a57" }
z80 = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "d64444aa6a1e38ab5068af216a58091f7ffb2a57" }
mos6502 = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "d64444aa6a1e38ab5068af216a58091f7ffb2a57" }
# The Commodore format crates (retroclawd-commodore), by revision.
cbm-dos = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "3cd353c42a9056c902fc7d861954f6bae89fb709" }
d64 = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "3cd353c42a9056c902fc7d861954f6bae89fb709" }
d71 = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "3cd353c42a9056c902fc7d861954f6bae89fb709" }
d81 = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "3cd353c42a9056c902fc7d861954f6bae89fb709" }
g64 = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "3cd353c42a9056c902fc7d861954f6bae89fb709" }
c64-tape = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "3cd353c42a9056c902fc7d861954f6bae89fb709" }
dsk = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "d64444aa6a1e38ab5068af216a58091f7ffb2a57" }
zx-tape = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "d64444aa6a1e38ab5068af216a58091f7ffb2a57" }
# Snapshot and cartridge formats of the machine families (by revision). Their Z80 snapshot types use the
# `retroclawd-crates` revision the families pin; keep it equal to the one above so there is one `z80` in the graph.
z80-snapshot = { git = "https://github.com/elpapimango/retroclawd-sinclair", rev = "1cca8e2ffc43bf0f61afe9bc6dc9593484b733da" }
sna-snapshot = { git = "https://github.com/elpapimango/retroclawd-sinclair", rev = "1cca8e2ffc43bf0f61afe9bc6dc9593484b733da" }
szx-snapshot = { git = "https://github.com/elpapimango/retroclawd-sinclair", rev = "1cca8e2ffc43bf0f61afe9bc6dc9593484b733da" }
zx81-snapshot = { git = "https://github.com/elpapimango/retroclawd-sinclair", rev = "1cca8e2ffc43bf0f61afe9bc6dc9593484b733da" }
cpc-snapshot = { git = "https://github.com/elpapimango/retroclawd-amstrad", rev = "59fdd2b60d871c1b9ace116759b85b2bc31a0852" }
cpc-cartridge = { git = "https://github.com/elpapimango/retroclawd-amstrad", rev = "59fdd2b60d871c1b9ace116759b85b2bc31a0852" }
c64-cartridge = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "3cd353c42a9056c902fc7d861954f6bae89fb709" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }

[profile.release]
strip = true
opt-level = 3
