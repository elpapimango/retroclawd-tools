[workspace]
resolver = "2"
exclude = ["fuzz"]
members = ["crates/rc-common", "crates/rcasm", "crates/rcdis", "crates/rcdisk", "crates/rcchd", "crates/rctape", "crates/rcsnap", "crates/rcld", "crates/rcar"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/elpapimango/retroclawd-tools"

[workspace.dependencies]
# The CPU cores and file formats: retroclawd-core, published as rc-*; the source keeps the short names.
atari-media = { package = "rc-atari-media", version = "0.1" }
c64-cartridge = { package = "rc-c64-cartridge", version = "0.1" }
c64-tape = { package = "rc-c64-tape", version = "0.1" }
cbm-dos = { package = "rc-cbm-dos", version = "0.1" }
chd = { package = "rc-chd", version = "0.1" }
cpc-cartridge = { package = "rc-cpc-cartridge", version = "0.1" }
cpc-snapshot = { package = "rc-cpc-snapshot", version = "0.1" }
d64 = { package = "rc-d64", version = "0.1" }
d71 = { package = "rc-d71", version = "0.1" }
d81 = { package = "rc-d81", version = "0.1" }
dsk = { package = "rc-dsk", version = "0.1" }
g64 = { package = "rc-g64", version = "0.1" }
machine = { package = "rc-machine", version = "0.1" }
huc6280 = { package = "rc-huc6280", version = "0.1" }
mc68000 = { package = "rc-mc68000", version = "0.1" }
mos6502 = { package = "rc-mos6502", version = "0.1" }
sna-snapshot = { package = "rc-sna-snapshot", version = "0.1" }
szx-snapshot = { package = "rc-szx-snapshot", version = "0.1" }
z80 = { package = "rc-z80", version = "0.1" }
z80-snapshot = { package = "rc-z80-snapshot", version = "0.1" }
zx-tape = { package = "rc-zx-tape", version = "0.1" }
zx81-snapshot = { package = "rc-zx81-snapshot", version = "0.1" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }

[profile.release]
strip = true
opt-level = "s"
