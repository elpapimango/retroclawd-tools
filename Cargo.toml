[workspace]
resolver = "2"
members = ["crates/rc-common", "crates/rcasm", "crates/rcdis", "crates/rcdisk", "crates/rctape", "crates/rcsnap", "crates/rcld", "crates/rc-suite"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# The retroclawd crates, by git revision (public repositories).
machine = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "f67f76b862f7567c0ba9b89191deb94854e115fd" }
z80 = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "f67f76b862f7567c0ba9b89191deb94854e115fd" }
mos6502 = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "f67f76b862f7567c0ba9b89191deb94854e115fd" }
# The Commodore format crates (retroclawd-commodore), by revision.
cbm-dos = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "8c82fa60f8d4a73fad2a7f60cf59f11fd774cdf2" }
d64 = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "8c82fa60f8d4a73fad2a7f60cf59f11fd774cdf2" }
d71 = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "8c82fa60f8d4a73fad2a7f60cf59f11fd774cdf2" }
d81 = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "8c82fa60f8d4a73fad2a7f60cf59f11fd774cdf2" }
g64 = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "8c82fa60f8d4a73fad2a7f60cf59f11fd774cdf2" }
c64-tape = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "8c82fa60f8d4a73fad2a7f60cf59f11fd774cdf2" }
dsk = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "f67f76b862f7567c0ba9b89191deb94854e115fd" }
zx-tape = { git = "https://github.com/elpapimango/retroclawd-crates", rev = "f67f76b862f7567c0ba9b89191deb94854e115fd" }
# Snapshot and cartridge formats of the machine families (by revision). Their Z80 snapshot types use the
# `retroclawd-crates` revision the families pin; keep it equal to the one above so there is one `z80` in the graph.
z80-snapshot = { git = "https://github.com/elpapimango/retroclawd-sinclair", rev = "7366563898813633b4229e4ca2298e291e7f840e" }
sna-snapshot = { git = "https://github.com/elpapimango/retroclawd-sinclair", rev = "7366563898813633b4229e4ca2298e291e7f840e" }
szx-snapshot = { git = "https://github.com/elpapimango/retroclawd-sinclair", rev = "7366563898813633b4229e4ca2298e291e7f840e" }
zx81-snapshot = { git = "https://github.com/elpapimango/retroclawd-sinclair", rev = "7366563898813633b4229e4ca2298e291e7f840e" }
cpc-snapshot = { git = "https://github.com/elpapimango/retroclawd-amstrad", rev = "ea9bedbfd011504296b609b5ec11983917b0327a" }
cpc-cartridge = { git = "https://github.com/elpapimango/retroclawd-amstrad", rev = "ea9bedbfd011504296b609b5ec11983917b0327a" }
c64-cartridge = { git = "https://github.com/elpapimango/retroclawd-commodore", rev = "8c82fa60f8d4a73fad2a7f60cf59f11fd774cdf2" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }

[profile.release]
strip = true
opt-level = 3
